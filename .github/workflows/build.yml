name: Build LineageOS 23.0 (topaz)

on:
  workflow_dispatch:
    inputs:
      variant:
        description: Build variant
        type: choice
        options: [userdebug, user, eng]
        default: userdebug
      target:
        description: make target
        default: bacon

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  LOS_BRANCH: lineage-23.0
  DEVICE: topaz
  # GitHub kills the job at 360 min; leave room to save ccache + upload.
  JOB_BUDGET_MIN: 335
  CCACHE_MAXSIZE: 8G

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Record start time
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Remove preinstalled software
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache \
            /usr/local/share/boost /usr/local/share/powershell /usr/share/swift /usr/local/.ghcup \
            /usr/lib/jvm /opt/microsoft /opt/google /usr/local/julia* /usr/share/miniconda || true
          sudo docker image prune -a -f || true
          sudo swapoff -a && sudo rm -f /mnt/swapfile /swapfile || true
          df -h

      - name: Prepare build dir and swap
        run: |
          sudo mkdir -p /build && sudo chown "$USER:$USER" /build
          sudo fallocate -l 16G /swapfile && sudo chmod 600 /swapfile
          sudo mkswap /swapfile && sudo swapon /swapfile
          df -h; free -h; nproc

      - name: Checkout local manifests
        uses: actions/checkout@v4
        with:
          path: manifests

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git git-lfs gnupg gperf imagemagick lib32readline-dev lib32z1-dev libelf-dev liblz4-tool \
            libsdl1.2-dev libssl-dev libxml2 libxml2-utils lz4 lzop pngcrush rsync schedtool \
            squashfs-tools xsltproc zip zlib1g-dev python3 python-is-python3 protobuf-compiler python3-protobuf
          sudo curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o /usr/local/bin/repo
          sudo chmod a+x /usr/local/bin/repo
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@users.noreply.github.com"
          git config --global color.ui false
          git lfs install

      - name: Start resource monitor
        run: |
          nohup bash -c 'while true; do echo "== $(date -u +%T) load=$(cut -d" " -f1-3 /proc/loadavg)"; free -m | sed -n 2,3p; df -m / /build | tail -2; sleep 60; done' > /build/monitor.log 2>&1 &

      - name: Init and sync sources
        working-directory: /build
        run: |
          mkdir -p src && cd src
          repo init -u https://github.com/LineageOS/android.git -b "$LOS_BRANCH" \
            --git-lfs --depth=1 --no-clone-bundle -g default,-mips,-darwin,-notdefault
          mkdir -p .repo/local_manifests
          cp "$GITHUB_WORKSPACE/manifests/local_manifests.xml" .repo/local_manifests/
          cp "$GITHUB_WORKSPACE/manifests/ci/remove_unneeded.xml" .repo/local_manifests/
          rc=0
          "$GITHUB_WORKSPACE/manifests/ci/sync.sh" || rc=$?
          du -sh .repo 2>/dev/null; du -sh -- */ 2>/dev/null | sort -rh | head -15
          tail -3 /build/monitor.log
          df -h /build
          exit $rc

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: /build/ccache
          key: ccache-${{ env.LOS_BRANCH }}-${{ env.DEVICE }}-${{ github.run_id }}
          restore-keys: ccache-${{ env.LOS_BRANCH }}-${{ env.DEVICE }}-

      - name: Build
        id: build
        working-directory: /build/src
        env:
          USE_CCACHE: 1
          CCACHE_EXEC: /usr/bin/ccache
          CCACHE_DIR: /build/ccache
          CCACHE_COMPRESS: 1
          CCACHE_COMPRESSLEVEL: 6
        run: |
          tail -3 /build/monitor.log
          ccache -M "$CCACHE_MAXSIZE"; ccache -z
          elapsed=$(( ($(date +%s) - JOB_START) / 60 ))
          left=$(( JOB_BUDGET_MIN - elapsed ))
          echo "Elapsed ${elapsed}m, building for at most ${left}m"
          set +e
          source build/envsetup.sh
          breakfast "$DEVICE" "${{ inputs.variant }}" || exit 1
          timeout --signal=INT --kill-after=2m "${left}m" m "${{ inputs.target }}" -j"$(nproc)" 2>&1 | tee /build/build.log
          rc=${PIPESTATUS[0]}
          set -e
          ccache -s
          df -h /build; free -h
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" = 124 ] || [ "$rc" = 130 ]; then
            echo "::warning::Build stopped at the time budget. ccache is saved; re-run the workflow to continue."
          fi
          exit "$rc"

      - name: Save ccache
        if: always() && steps.build.outcome != 'skipped'
        uses: actions/cache/save@v4
        with:
          path: /build/ccache
          key: ccache-${{ env.LOS_BRANCH }}-${{ env.DEVICE }}-${{ github.run_id }}

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            /build/build.log
            /build/monitor.log
            /build/src/out/error.log
            /build/src/out/soong.log
          if-no-files-found: ignore

      - name: Publish ROM to a release
        if: success()
        working-directory: /build/src/out/target/product/${{ env.DEVICE }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip=$(ls -t lineage-*.zip | head -1)
          sha256sum "$zip" > "$zip.sha256sum"
          files=("$zip" "$zip.sha256sum")
          for img in boot.img vendor_boot.img dtbo.img recovery.img; do [ -f "$img" ] && files+=("$img"); done
          tag="${DEVICE}-$(date +%Y%m%d)-${{ github.run_number }}"
          gh release create "$tag" "${files[@]}" -R "$GITHUB_REPOSITORY" \
            --title "LineageOS 23.0 $DEVICE $(date +%Y-%m-%d)" --notes "Built by run ${{ github.run_id }} (no MIUI Camera)."
